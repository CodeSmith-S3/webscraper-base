<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #00d4ff, #7b2ff7);
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #e4e4e4;
            --text-secondary: #8892b0;
            --text-muted: #6a7180;
            --accent-cyan: #00d4ff;
            --accent-purple: #7b2ff7;
            --success-color: #00ff88;
            --error-color: #ff5252;
            --shadow-glow: 0 0 20px rgba(0, 212, 255, 0.2);
            --border-radius-lg: 16px;
            --border-radius-md: 12px;
            --border-radius-sm: 8px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .app-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
            padding: 1.5rem;
            min-height: 100vh;
        }

        .main-content { display: flex; flex-direction: column; gap: 1.5rem; }

        header { text-align: center; padding: 1rem 0; }

        .logo { display: inline-flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }

        .logo-icon {
            font-size: 2.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { color: var(--text-secondary); font-size: 1rem; }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--card-border);
        }

        .card-title { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .card-title i { color: var(--accent-cyan); }
        .card-body { padding: 1.25rem; }

        .input-group { display: flex; gap: 0.75rem; margin-bottom: 1rem; }

        .url-input {
            flex: 1;
            padding: 0.875rem 1rem;
            font-size: 0.95rem;
            border: 2px solid var(--card-border);
            border-radius: var(--border-radius-md);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
            transition: all var(--transition-normal);
        }

        .url-input:focus { border-color: var(--accent-cyan); box-shadow: var(--shadow-glow); }
        .url-input::placeholder { color: var(--text-muted); }

        .btn {
            padding: 0.875rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .btn-primary { background: var(--primary-gradient); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3); }

        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); border: 1px solid var(--card-border); }
        .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.15); border-color: var(--accent-cyan); }

        .btn-success { background: linear-gradient(135deg, #00c853, #00ff88); color: #1a1a2e; }
        .btn-success:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3); }

        .btn-danger { background: rgba(255, 82, 82, 0.2); color: var(--error-color); border: 1px solid rgba(255, 82, 82, 0.3); }
        .btn-danger:hover:not(:disabled) { background: rgba(255, 82, 82, 0.3); }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .btn-sm { padding: 0.5rem 0.875rem; font-size: 0.85rem; }
        .btn-icon { padding: 0.5rem; width: 36px; height: 36px; }

        .spinner {
            width: 18px; height: 18px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .btn.loading .spinner { display: block; }
        .btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .action-buttons { display: flex; gap: 0.75rem; flex-wrap: wrap; }

        .save-options {
            display: none;
            gap: 0.75rem;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
            margin-top: 1rem;
            animation: fadeIn 0.3s ease;
        }
        .save-options.visible { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .filename-input {
            flex: 1;
            padding: 0.625rem 0.875rem;
            font-size: 0.9rem;
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius-sm);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
        }
        .filename-input:focus { border-color: var(--accent-cyan); }

        .format-select {
            padding: 0.625rem 0.875rem;
            font-size: 0.9rem;
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius-sm);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
            cursor: pointer;
        }
        .format-select option { background: #1a1a2e; }

        .output-section { flex: 1; display: flex; flex-direction: column; }
        .output-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .output-info { display: flex; flex-direction: column; gap: 0.25rem; }
        .output-title { font-size: 1rem; font-weight: 600; }
        .output-meta { font-size: 0.8rem; color: var(--text-secondary); }
        .output-meta a { color: var(--accent-cyan); text-decoration: none; }
        .output-meta a:hover { text-decoration: underline; }

        .tab-buttons { display: flex; gap: 0.375rem; }
        .tab-btn {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius-sm);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.05); }
        .tab-btn.active { background: rgba(0, 212, 255, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }

        .output-content { flex: 1; padding: 1.25rem; min-height: 400px; max-height: calc(100vh - 380px); overflow-y: auto; }

        .markdown-body { background: transparent !important; color: var(--text-primary) !important; font-size: 0.95rem; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            color: #fff !important; border-bottom-color: var(--card-border) !important; margin-top: 1.5em; margin-bottom: 0.75em;
        }
        .markdown-body a { color: var(--accent-cyan) !important; }
        .markdown-body code { background: rgba(0, 0, 0, 0.3) !important; color: var(--accent-cyan) !important; padding: 0.2em 0.4em; border-radius: 4px; }
        .markdown-body pre { background: rgba(0, 0, 0, 0.4) !important; border: 1px solid var(--card-border) !important; border-radius: var(--border-radius-sm); padding: 1rem; }
        .markdown-body pre code { background: transparent !important; padding: 0; }
        .markdown-body blockquote { border-left: 4px solid var(--accent-purple) !important; color: var(--text-secondary) !important; background: rgba(123, 47, 247, 0.1); padding: 0.5rem 1rem; margin: 1rem 0; }
        .markdown-body table { display: block; overflow-x: auto; }
        .markdown-body table tr { background: transparent !important; border-top-color: var(--card-border) !important; }
        .markdown-body table tr:nth-child(2n) { background: rgba(0, 0, 0, 0.2) !important; }
        .markdown-body table th, .markdown-body table td { border-color: var(--card-border) !important; padding: 0.5rem 0.75rem; }
        .markdown-body hr { background: var(--card-border) !important; }
        .markdown-body img { max-width: 100%; border-radius: var(--border-radius-sm); }
        .markdown-body ul, .markdown-body ol { padding-left: 1.5em; }
        .markdown-body li { margin: 0.25em 0; }

        .raw-text {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; color: var(--text-muted); text-align: center; }
        .placeholder-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.4; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .placeholder-text { font-size: 1rem; }
        .placeholder-hint { font-size: 0.85rem; margin-top: 0.5rem; opacity: 0.7; }

        .message { padding: 0.875rem 1rem; border-radius: var(--border-radius-sm); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .message-error { background: rgba(255, 82, 82, 0.1); border: 1px solid rgba(255, 82, 82, 0.3); color: var(--error-color); }
        .message-success { background: rgba(0, 255, 136, 0.1); border: 1px solid rgba(0, 255, 136, 0.3); color: var(--success-color); }
        .message i { font-size: 1.1rem; }
        .message-text { flex: 1; }
        .message-close { background: none; border: none; color: inherit; cursor: pointer; opacity: 0.7; padding: 0.25rem; }
        .message-close:hover { opacity: 1; }

        .success-badge { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.25rem 0.625rem; background: rgba(0, 255, 136, 0.15); border-radius: 20px; color: var(--success-color); font-size: 0.75rem; font-weight: 600; margin-right: 0.5rem; }

        .sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
        .sidebar .card { flex-shrink: 0; }

        .file-browser { max-height: calc(100vh - 200px); display: flex; flex-direction: column; }
        .file-browser .card-body { flex: 1; overflow-y: auto; padding: 0; }
        .file-list { list-style: none; }
        .file-item { display: flex; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid var(--card-border); transition: background var(--transition-fast); }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background: rgba(255, 255, 255, 0.05); }
        .file-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgba(0, 212, 255, 0.1); border-radius: var(--border-radius-sm); color: var(--accent-cyan); margin-right: 0.75rem; flex-shrink: 0; }
        .file-info { flex: 1; min-width: 0; }
        .file-name { font-size: 0.9rem; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.125rem; }
        .file-actions { display: flex; gap: 0.375rem; margin-left: 0.5rem; }
        .file-actions .btn-icon { width: 30px; height: 30px; font-size: 0.8rem; opacity: 0.7; }
        .file-actions .btn-icon:hover { opacity: 1; }
        .empty-files { padding: 2rem; text-align: center; color: var(--text-muted); }
        .empty-files i { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; display: block; }
        .empty-files p { font-size: 0.9rem; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        .stat-item { background: rgba(0, 0, 0, 0.2); border-radius: var(--border-radius-sm); padding: 0.875rem; text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.25rem; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        .hidden { display: none !important; }

        @media (max-width: 1024px) {
            .app-container { grid-template-columns: 1fr; }
            .sidebar { order: 2; }
            .file-browser { max-height: 400px; }
        }

        @media (max-width: 640px) {
            .app-container { padding: 1rem; }
            h1 { font-size: 1.75rem; }
            .input-group { flex-direction: column; }
            .btn { width: 100%; }
            .action-buttons { flex-direction: column; }
            .save-options { flex-direction: column; align-items: stretch; }
            .output-header { flex-direction: column; align-items: flex-start; }
            .tab-buttons { width: 100%; }
            .tab-btn { flex: 1; }
        }

        [data-tooltip] { position: relative; }
        [data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.375rem 0.625rem;
            background: #1a1a2e;
            color: #fff;
            font-size: 0.75rem;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-fast);
            margin-bottom: 0.5rem;
            z-index: 100;
        }
        [data-tooltip]:hover::after { opacity: 1; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="main-content">
            <header>
                <div class="logo">
                    <i class="fas fa-spider logo-icon"></i>
                    <h1>Web Scraper</h1>
                </div>
                <p class="subtitle">Extract clean, structured content from any webpage</p>
            </header>

            <div class="card input-section">
                <div class="card-body">
                    <div class="input-group">
                        <input type="text" class="url-input" id="urlInput" placeholder="Enter URL to scrape (e.g., https://example.com)" autofocus>
                        <button class="btn btn-primary" id="scrapeBtn" onclick="scrapeUrl()">
                            <span class="btn-text"><i class="fas fa-search"></i> Scrape</span>
                            <div class="spinner"></div>
                        </button>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-secondary btn-sm" id="saveToggleBtn" onclick="toggleSaveOptions()" disabled>
                            <i class="fas fa-save"></i> Save Output
                        </button>
                        <button class="btn btn-secondary btn-sm" id="copyBtn" onclick="copyToClipboard()" disabled>
                            <i class="fas fa-copy"></i> Copy
                        </button>
                        <button class="btn btn-secondary btn-sm" id="clearBtn" onclick="clearOutput()" disabled>
                            <i class="fas fa-trash-alt"></i> Clear
                        </button>
                    </div>

                    <div class="save-options" id="saveOptions">
                        <input type="text" class="filename-input" id="filenameInput" placeholder="Enter filename">
                        <select class="format-select" id="formatSelect">
                            <option value="md">.md (Markdown)</option>
                            <option value="txt">.txt (Plain Text)</option>
                        </select>
                        <button class="btn btn-success btn-sm" onclick="saveFile()">
                            <i class="fas fa-download"></i> Save
                        </button>
                        <button class="btn btn-secondary btn-sm btn-icon" onclick="toggleSaveOptions()" data-tooltip="Cancel">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="messageContainer"></div>

            <div class="card output-section">
                <div class="card-header output-header">
                    <div class="output-info">
                        <span class="output-title" id="pageTitle">Output Preview</span>
                        <div class="output-meta" id="pageMeta"></div>
                    </div>
                    <div class="tab-buttons">
                        <button class="tab-btn active" data-tab="markdown" onclick="switchTab('markdown')">
                            <i class="fab fa-markdown"></i> Rendered
                        </button>
                        <button class="tab-btn" data-tab="raw" onclick="switchTab('raw')">
                            <i class="fas fa-code"></i> Raw
                        </button>
                    </div>
                </div>
                <div class="output-content">
                    <div id="placeholderContent" class="placeholder">
                        <i class="fas fa-file-alt placeholder-icon"></i>
                        <div class="placeholder-text">Enter a URL above and click "Scrape" to see results</div>
                        <div class="placeholder-hint">Supports any public webpage</div>
                    </div>
                    <div id="markdownContent" class="markdown-body hidden"></div>
                    <div id="rawContent" class="raw-text hidden"></div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><i class="fas fa-chart-bar"></i> Stats</span>
                </div>
                <div class="card-body">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="statFiles">0</div>
                            <div class="stat-label">Files Saved</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statSize">0 KB</div>
                            <div class="stat-label">Total Size</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card file-browser">
                <div class="card-header">
                    <span class="card-title"><i class="fas fa-folder-open"></i> Saved Files</span>
                    <button class="btn btn-secondary btn-sm btn-icon" onclick="refreshFiles()" data-tooltip="Refresh">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="card-body">
                    <ul class="file-list" id="fileList">
                        <li class="empty-files">
                            <i class="fas fa-inbox"></i>
                            <p>No files saved yet</p>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    
    <script>
        marked.setOptions({ breaks: true, gfm: true });

        const urlInput = document.getElementById('urlInput');
        const scrapeBtn = document.getElementById('scrapeBtn');
        const saveToggleBtn = document.getElementById('saveToggleBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const saveOptions = document.getElementById('saveOptions');
        const filenameInput = document.getElementById('filenameInput');
        const formatSelect = document.getElementById('formatSelect');
        const messageContainer = document.getElementById('messageContainer');
        const pageTitle = document.getElementById('pageTitle');
        const pageMeta = document.getElementById('pageMeta');
        const placeholderContent = document.getElementById('placeholderContent');
        const markdownContent = document.getElementById('markdownContent');
        const rawContent = document.getElementById('rawContent');
        const fileList = document.getElementById('fileList');
        const statFiles = document.getElementById('statFiles');
        const statSize = document.getElementById('statSize');

        let currentData = null;
        let currentTab = 'markdown';

        urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') scrapeUrl(); });

        async function scrapeUrl() {
            const url = urlInput.value.trim();
            if (!url) { showMessage('Please enter a URL to scrape', 'error'); return; }

            hideMessages();
            setLoading(true);

            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'Failed to scrape URL');

                if (data.success) {
                    currentData = data;
                    displayResults(data);
                    enableButtons();
                    const safeName = data.title.replace(/[^a-zA-Z0-9\s-]/g, '').replace(/\s+/g, '_').substring(0, 50);
                    filenameInput.value = safeName || 'scraped_content';
                    showMessage('Page scraped successfully!', 'success');
                } else {
                    throw new Error(data.error || 'Unknown error occurred');
                }
            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                setLoading(false);
            }
        }

        function displayResults(data) {
            pageTitle.innerHTML = '<span class="success-badge"><i class="fas fa-check"></i> Scraped</span>' + escapeHtml(data.title);
            pageMeta.innerHTML = '<a href="' + escapeHtml(data.url) + '" target="_blank" rel="noopener">' + escapeHtml(data.url) + '</a>';
            placeholderContent.classList.add('hidden');
            const rawHtml = marked.parse(data.markdown);
            markdownContent.innerHTML = DOMPurify.sanitize(rawHtml);
            rawContent.textContent = data.markdown;
            switchTab(currentTab);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
            if (currentData) {
                markdownContent.classList.toggle('hidden', tab !== 'markdown');
                rawContent.classList.toggle('hidden', tab !== 'raw');
            }
        }

        function toggleSaveOptions() {
            saveOptions.classList.toggle('visible');
            if (saveOptions.classList.contains('visible')) filenameInput.focus();
        }

        async function saveFile() {
            if (!currentData) { showMessage('No content to save', 'error'); return; }
            const filename = filenameInput.value.trim() || 'scraped_content';
            const format = formatSelect.value;
            const content = format === 'md' ? currentData.markdown : currentData.text;

            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, filename, format })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'Failed to save file');
                showMessage('File saved: ' + data.filename, 'success');
                toggleSaveOptions();
                refreshFiles();
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        async function refreshFiles() {
            try {
                const response = await fetch('/api/files');
                const files = await response.json();

                if (files.length === 0) {
                    fileList.innerHTML = '<li class="empty-files"><i class="fas fa-inbox"></i><p>No files saved yet</p></li>';
                    statFiles.textContent = '0';
                    statSize.textContent = '0 KB';
                    return;
                }

                statFiles.textContent = files.length;
                const totalSize = files.reduce((acc, f) => acc + f.size, 0);
                statSize.textContent = formatFileSize(totalSize);

                fileList.innerHTML = files.map(file => 
                    '<li class="file-item">' +
                    '<div class="file-icon"><i class="fas fa-file-' + (file.name.endsWith('.md') ? 'alt' : 'lines') + '"></i></div>' +
                    '<div class="file-info"><div class="file-name" title="' + escapeHtml(file.name) + '">' + escapeHtml(file.name) + '</div>' +
                    '<div class="file-meta">' + formatFileSize(file.size) + ' • ' + formatDate(file.modified) + '</div></div>' +
                    '<div class="file-actions">' +
                    '<button class="btn btn-secondary btn-icon" onclick="downloadFile(\'' + escapeHtml(file.name) + '\')" data-tooltip="Download"><i class="fas fa-download"></i></button>' +
                    '<button class="btn btn-danger btn-icon" onclick="deleteFile(\'' + escapeHtml(file.name) + '\')" data-tooltip="Delete"><i class="fas fa-trash"></i></button>' +
                    '</div></li>'
                ).join('');
            } catch (error) {
                console.error('Failed to load files:', error);
            }
        }

        function downloadFile(filename) { window.open('/api/files/' + encodeURIComponent(filename), '_blank'); }

        async function deleteFile(filename) {
            if (!confirm('Delete "' + filename + '"?')) return;
            try {
                const response = await fetch('/api/files/' + encodeURIComponent(filename), { method: 'DELETE' });
                if (!response.ok) { const data = await response.json(); throw new Error(data.detail || 'Failed to delete file'); }
                showMessage('File deleted', 'success');
                refreshFiles();
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        function copyToClipboard() {
            if (!currentData) return;
            const content = currentTab === 'markdown' ? currentData.markdown : currentData.text;
            navigator.clipboard.writeText(content).then(() => showMessage('Copied to clipboard!', 'success')).catch(() => showMessage('Failed to copy', 'error'));
        }

        function clearOutput() {
            currentData = null;
            pageTitle.textContent = 'Output Preview';
            pageMeta.innerHTML = '';
            placeholderContent.classList.remove('hidden');
            markdownContent.classList.add('hidden');
            markdownContent.innerHTML = '';
            rawContent.classList.add('hidden');
            rawContent.textContent = '';
            saveOptions.classList.remove('visible');
            disableButtons();
            hideMessages();
        }

        function setLoading(loading) {
            scrapeBtn.classList.toggle('loading', loading);
            scrapeBtn.disabled = loading;
            urlInput.disabled = loading;
        }

        function enableButtons() { saveToggleBtn.disabled = false; copyBtn.disabled = false; clearBtn.disabled = false; }
        function disableButtons() { saveToggleBtn.disabled = true; copyBtn.disabled = true; clearBtn.disabled = true; }

        function showMessage(text, type = 'info') {
            const icon = type === 'error' ? 'exclamation-circle' : 'check-circle';
            messageContainer.innerHTML = '<div class="message message-' + type + '"><i class="fas fa-' + icon + '"></i><span class="message-text">' + escapeHtml(text) + '</span><button class="message-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button></div>';
            if (type === 'success') setTimeout(() => { const msg = messageContainer.querySelector('.message'); if (msg) msg.remove(); }, 4000);
        }

        function hideMessages() { messageContainer.innerHTML = ''; }

        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatDate(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            const diff = now - date;
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
            if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
            if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
            return date.toLocaleDateString();
        }

        document.addEventListener('DOMContentLoaded', () => { refreshFiles(); });
    </script>
</body>
</html>
