services:
  webscraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webscraper-app
    ports:
      - "8001:8001"
    volumes:
      # Persist scraped outputs to host machine
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - scraper-network

networks:
  scraper-network:
    driver: bridge